[project]
name = "dbt-inline-docs"
version = "0.1.0"
description = "Write inline Javadoc-style dbt model & column docs (no more separate YAML files!)"
readme = "README.md"
authors = [
    { name = "Tim Vergenz", email = "vergenzt@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10.15",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
